name: Build Windows EXE

# Jab bhi 'main' branch pe push karo, ya manually "Run workflow" dabao,
# ya v* tag push karo (release ke liye) — tab .exe automatically ban jayega.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Windows 7 32-bit customers ke liye 32-bit Python — 64-bit EXE
      # purane 32-bit Windows pe chalta nahi hai.
      - name: Set up Python 3.8 (32-bit)
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: 'x86'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install openpyxl reportlab python-barcode pillow pywin32
          pip install google-auth google-auth-oauthlib google-api-python-client

      # --collect-all har library ka poora code + data files + hidden imports
      # bundle kar deta hai — isse "sys.executable EXE ko point karta hai"
      # wala pip auto-install fallback issue nahi aata (jo pehle track kiya tha).
      #
      # icon.ico repo ke ROOT mein honi chahiye (kapda_shoes_billing.pyw ke
      # saath). --icon EXE file ka icon set karta hai (Explorer/Desktop mein
      # dikhta hai); --add-data icon.ico ko EXE ke andar bundle karta hai taaki
      # software chalte waqt window/taskbar pe bhi wahi logo dikhe
      # (kapda_shoes_billing.pyw ke set_app_icon() function ko chahiye).
      - name: Build EXE with PyInstaller
        run: >
          pyinstaller --onefile --windowed
          --name KapdaShoesBilling
          --icon "icon.ico"
          --add-data "icon.ico;."
          --collect-all openpyxl
          --collect-all reportlab
          --collect-all barcode
          --collect-all PIL
          --collect-all google_auth_oauthlib
          --collect-all googleapiclient
          --collect-all google.auth
          --hidden-import win32print
          --hidden-import win32timezone
          kapda_shoes_billing.pyw

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: KapdaShoesBilling-exe
          path: dist/KapdaShoesBilling.exe

      # Sirf tab chalega jab aap 'v1.0.0' jaisa tag push karoge —
      # ek proper GitHub Release ban jayega jisme .exe attach hoga.
      - name: Create GitHub Release (tag push par)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KapdaShoesBilling.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
